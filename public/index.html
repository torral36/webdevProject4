<!DOCTYPE html>
<!-- Devon Torralva -->
<!-- CS 310 - Project 4, Problem 1 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Two Player Tic Tac Toe - Devon Torralva</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Two Player Tic Tac Toe</h1>
  <h2>Project 4 - Devon Torralva</h2>

  <!-- Login section -->
  <div id="login">
    <input id="nameInput" placeholder="First Name">
    <input id="passwordInput" type="password" placeholder="Password">
    <button id="joinBtn">Join Game</button>
  </div>

  <div id="role"></div>   <!-- Displays role information -->
  <div id="status"></div> <!-- Displays turn or winner -->

  <canvas id="board" width="600" height="600"></canvas>

  <button id="resetBtn">Reset Game</button>

  <script src="client.js"></script>
</body>
</html>
